# SystemD unit status.
#
# Drop this in /etc/telegraf/telegraf.d/.
#
# The second output only exists when this host's main output writes to a
# different bucket than the one the dashboard reads. If your Telegraf already
# writes to the right bucket, delete it and keep only the input.
#
# When you do keep it, also add to the existing output in telegraf.conf:
#     namedrop = ["services_stats"]
# otherwise the measurement is written twice.

[[inputs.exec]]
  commands = ["/usr/bin/python3 /opt/srvstatus/service.py"]
  timeout = "10s"
  name_override = "services_stats"
  data_format = "json"
  tag_keys = ["service"]

