# Proxmox functional health.
#
# Line protocol rather than JSON: the script emits several distinct
# measurements (pve_cluster, pve_replication, pve_storage, pve_ha, pve_zfs),
# and the JSON parser can only produce one measurement per input.

[[inputs.exec]]
  commands = ["/usr/bin/python3 /opt/srvstatus/pve_health.py"]
  timeout = "25s"
  data_format = "influx"
  interval = "60s"
